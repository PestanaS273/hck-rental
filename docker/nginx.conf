# nginx descarta los add_header del bloque server cuando una location define los suyos,
# por eso los encabezados de seguridad se repiten en cada location mediante `include`.
server {
  # 80 es el puerto documentado; 3000 es el valor por defecto de "Ports Exposes" en Coolify.
  # Escuchar en ambos evita el 502 del proxy si el recurso quedó con el valor por defecto.
  listen 80 default_server;
  listen 3000 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  error_page 404 /404.html;

  # Una sola URL por página: /servicios/ → /servicios
  rewrite ^/(.+)/$ /$1 permanent;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Assets con hash de Vite: inmutables.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fotos y video: caché de una semana, revalidable (los nombres no llevan hash).
  location /media/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # Rutas prerenderizadas: /servicios → /servicios/index.html. Lo que no existe responde 404 real con 404.html
  # (la app hidrata y muestra su página de "no encontrada"). Sin caché para publicar cambios al instante.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location ~* ^/(sitemap\.xml|robots\.txt)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }
}
